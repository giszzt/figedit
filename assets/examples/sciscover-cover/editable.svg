    <text id="science-china-masthead" x="145" y="154" font-family="Georgia, Times New Roman, serif" font-size="69" font-weight="700" fill="#ffffff" text-anchor="start"><tspan x="145" dy="0">SCIENCE CHINA</tspan></text>
    <text id="issn-network" x="975" y="108" font-family="Arial, Helvetica, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#ffffff" text-anchor="start"><tspan x="975" dy="0">ISSN 1869-1919 (网络)</tspan></text>
    <text id="issn-print" x="975" y="132" font-family="Arial, Helvetica, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#ffffff" text-anchor="start"><tspan x="975" dy="0">ISSN 1674-733X (印刷)</tspan></text>
