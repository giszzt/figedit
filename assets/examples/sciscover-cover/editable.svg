    <text id="footer-sponsor" x="48" y="1547" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#ffffff" text-anchor="start"><tspan x="48" dy="0">Sponsored by</tspan><tspan x="48" dy="26.25">Chinese Academy of Sciences and</tspan><tspan x="48" dy="26.25">National Natural Science Foundation of China</tspan></text>
