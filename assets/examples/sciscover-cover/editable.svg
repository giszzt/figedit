    <text id="title-information" x="42" y="354" font-family="Georgia, Times New Roman, serif" font-size="157" font-weight="700" fill="#ffffff" text-anchor="start"><tspan x="42" dy="0">Information</tspan></text>
    <text id="shadow-title-sciences" x="51" y="525" font-family="Georgia, Times New Roman, serif" font-size="143" font-weight="700" fill="#00051d" text-anchor="start"><tspan x="51" dy="0">Sciences</tspan></text>
    <text id="title-sciences" x="45" y="518" font-family="Georgia, Times New Roman, serif" font-size="143" font-weight="700" fill="#ffffff" text-anchor="start"><tspan x="45" dy="0">Sciences</tspan></text>
    <text id="issue-volume" x="704" y="470" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#ffffff" text-anchor="start"><tspan x="704" dy="0">Volume 69 · Number 1</tspan></text>
