      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="context-stroke"/>
    </marker>
  </defs>

  <style>
    :root {
      --font-sans: "Inter", "Arial", "Helvetica", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      --font-serif: "Georgia", "Times New Roman", "Noto Serif CJK SC", serif;
      --font-hand: "Comic Sans MS", "Comic Neue", "Arial Rounded MT Bold", "Microsoft YaHei", sans-serif;
    }
  </style>
  <rect id="canvas-background" x="0" y="0" width="1240" height="1654" fill="#0d2442"/>
  <g id="background">
    <image id="background-plate" href="assets/clean_plate_raw.png" x="0" y="0" width="1240" height="1654" preserveAspectRatio="none"/>
  </g>
  <g id="assets">
    <image id="top-science-china-emblem" href="assets/top_science_china_emblem.png" x="48" y="80" width="82" height="105" preserveAspectRatio="xMidYMid meet"/>
    <image id="footer-science-china-press-logo-block" href="assets/footer_science_china_press.png" x="545" y="1534" width="365" height="66" preserveAspectRatio="xMidYMid meet"/>
    <image id="footer-springer-logo-block" href="assets/footer_springer.png" x="965" y="1534" width="245" height="66" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="panels">
